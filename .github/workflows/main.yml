on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar tu código
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Instalar Java (Necesario para Android)
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    # 3. Instalar Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 4. Instalar Flutter (Motor gráfico)
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # Flet 0.28.x está basado en Flutter 3.29; fijar la versión evita
        # cambios incompatibles cuando el canal stable avance.
        flutter-version: '3.29.3'

    # Los runners pueden traer el Android SDK instalado, pero sus licencias
    # no siempre están aceptadas. Aceptarlas aquí evita que Gradle falle luego.
    - name: Accept Android SDK licenses
      run: |
        python -c "import subprocess; p=subprocess.run(['flutter','doctor','--android-licenses'], input='y\\n'*100, text=True); raise SystemExit(p.returncode)"

    # 5. Instalar Flet y dependencias
    - name: Install Dependencies
      run: pip install -r requirements.txt

    # Para que Android permita instalar cada APK encima de la anterior, todas
    # deben usar el mismo certificado. La clave se guarda en GitHub Secrets.
    - name: Prepare Android signing key
      shell: bash
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "Falta el secreto ANDROID_KEYSTORE_BASE64. Configura los cuatro secretos Android antes de compilar una APK actualizable."
          exit 1
        fi
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jfinanzas-release.jks"
        echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jfinanzas-release.jks" >> "$GITHUB_ENV"

    # 6. Compilar la APK
    - name: Build APK
      shell: bash
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
          echo "Faltan ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD o ANDROID_KEY_ALIAS en GitHub Secrets."
          exit 1
        fi
        for attempt in 1 2 3; do
          if flet build apk --template flet_build_template --verbose \
            --build-number "$GITHUB_RUN_NUMBER" \
            --android-signing-key-store "$ANDROID_KEYSTORE_PATH" \
            --android-signing-key-store-password "$ANDROID_KEYSTORE_PASSWORD" \
            --android-signing-key-password "$ANDROID_KEY_PASSWORD" \
            --android-signing-key-alias "$ANDROID_KEY_ALIAS" \
            2>&1 | tee /tmp/flet-build.log; then
            exit 0
          else
            build_status=${PIPESTATUS[0]}
          fi

          if ! grep -qE 'Too Many Requests|status code 429' /tmp/flet-build.log || [ "$attempt" -eq 3 ]; then
            exit "$build_status"
          fi

          echo "Maven Central limitó temporalmente las descargas (HTTP 429). Reintentando en $((attempt * 20)) segundos..."
          sleep $((attempt * 20))
        done

    # 7. Subir el resultado para que lo descargues
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-finanzas-release
        path: build/apk/app-release.apk
